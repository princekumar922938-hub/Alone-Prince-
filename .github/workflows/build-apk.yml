name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found: $JAVA_VER"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have .apk extension"; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Verified debug APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$TMP_DIR"

          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${TMP_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_ASSET_PATH"

          if [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $TARGET_ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $TARGET_ASSET_PATH ($ASSET_FILENAME)"
          echo "asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist at '$ASSET_PATH'"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty at '$ASSET_PATH'"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset file '$ASSET_PATH' does not have .apk extension"; exit 1 ;;
          esac

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<'EOF'
          ### Debug APK Build Details

          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **GitHub Actions Run Number:** ${{ github.run_number }}
          - **GitHub Actions Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}

          > [!NOTE]
          > - This APK is intended for testing.
          > - The APK is not a Play Store production release.
          > - The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Publishing release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Confirming GitHub Release ==="
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## 🚀 Debug APK Build & Release Succeeded!

            - **Release Title:** $RELEASE_TITLE
            - **Release Tag:** \`$TAG_NAME\`
            - **Direct Download Page:** [$RELEASE_URL]($RELEASE_URL)
            - **APK Asset Filename:** \`$ASSET_NAME\`

            ### How to Download:
            1. Visit the release page: [$RELEASE_URL]($RELEASE_URL)
            2. Scroll to the **Assets** section.
            3. Click on \`$ASSET_NAME\` to directly download the APK to your Android device.

            > ℹ️ The standard GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup under the workflow run summary.
            EOF
          else
            echo "::warning::GitHub Release publishing did not succeed."
            echo "The APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## ⚠️ Debug APK Built (Release Publishing Warning)

            - **Build Status:** APK build and Actions artifact upload succeeded.
            - **GitHub Actions Artifact:** \`app-debug-apk\` (Available in the Summary tab of this workflow run)
            - **Note:** GitHub Release creation did not complete, but your built debug APK is fully preserved and downloadable from the GitHub Actions artifacts section.
            EOF
          fi
